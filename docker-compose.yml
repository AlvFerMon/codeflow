# CodeFlow — entorno de desarrollo con Docker
# Uso:  docker compose up -d --build      (la primera vez tarda unos minutos)
#       Web: http://localhost:8080   ·   Correos de prueba: http://localhost:8025
#       MySQL (DBeaver): localhost:${DB_FORWARD_PORT}
#       IA (opcional): docker compose --profile ia up -d   (Ollama + procesador de la cola de análisis)
name: codeflow

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Europe/Madrid
    # max_allowed_packet: un archivo de 50 MB ocupa ~120 MB cifrado (compresión + base64)
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--max-allowed-packet=512M"]
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment: &app-env
      APP_NAME: CodeFlow
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${APP_PORT:-8080}
      APP_LOCALE: es
      APP_FALLBACK_LOCALE: en
      APP_FAKER_LOCALE: es_ES
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: no-reply@codeflow.test
      MAIL_FROM_NAME: CodeFlow
      CODEFLOW_SEED_DEMO: ${CODEFLOW_SEED_DEMO:-true}
      # Límites de subida (si se suben, ajustar también docker/php/php.ini y nginx)
      CODEFLOW_MAX_FILE_MB: ${CODEFLOW_MAX_FILE_MB:-50}
      CODEFLOW_MAX_UPLOAD_MB: ${CODEFLOW_MAX_UPLOAD_MB:-500}
      CODEFLOW_MAX_FILES: ${CODEFLOW_MAX_FILES:-1000}
      # Rendimiento: cachés de Laravel (config, rutas, eventos, vistas) fuera de la carpeta de Windows
      CODEFLOW_OPTIMIZE: ${CODEFLOW_OPTIMIZE:-true}
      VIEW_COMPILED_PATH: /var/www/cache/views
      APP_CONFIG_CACHE: /var/www/cache/config.php
      APP_ROUTES_CACHE: /var/www/cache/routes-v7.php
      APP_EVENTS_CACHE: /var/www/cache/events.php
      APP_PACKAGES_CACHE: /var/www/cache/packages.php
      APP_SERVICES_CACHE: /var/www/cache/services.php
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD}
      # IA opcional (revisión de pull requests con un modelo local). Ver README › Revisión con IA
      CODEFLOW_AI_ENABLED: ${CODEFLOW_AI_ENABLED:-false}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:3b}
      CODEFLOW_AI_TIMEOUT: ${CODEFLOW_AI_TIMEOUT:-300}
      TZ: Europe/Madrid
    volumes:
      - ./backend:/var/www/html
      # vendor y cachés en volúmenes de Docker (sistema de archivos Linux, mucho más rápido que la carpeta de Windows)
      - vendor:/var/www/html/vendor
      - laravel-cache:/var/www/cache

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  # Compila CSS/JS (Tailwind + Vite) en backend/public/build y termina
  assets:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund --ignore-scripts && npm run build"
    volumes:
      - ./backend:/app
      - node-modules:/app/node_modules
      - vendor:/app/vendor:ro

  # ── IA opcional (perfil "ia") ─────────────────────────────────────────────────
  # Motor de IA local. Más adelante puede ir en otro servidor: basta con cambiar OLLAMA_URL.
  # Descargar el modelo la primera vez: docker compose exec ollama ollama pull qwen2.5-coder:3b
  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-latest}
    profiles: ["ia"]
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama

  # Procesa en segundo plano la cola "ai" (los análisis tardan de segundos a minutos)
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    profiles: ["ia"]
    restart: unless-stopped
    depends_on:
      - app
    environment: *app-env
    working_dir: /var/www/html
    # Espera a que el contenedor "app" haya instalado las dependencias y migrado la base de datos
    entrypoint: ["sh", "-c", "until [ -f vendor/autoload.php ] && php artisan migrate:status >/dev/null 2>&1; do sleep 3; done; exec php artisan queue:work database --queue=ai --tries=1 --timeout=1800 --sleep=3"]
    volumes:
      - ./backend:/var/www/html
      - vendor:/var/www/html/vendor
      - laravel-cache:/var/www/cache

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  mysql-data:
  node-modules:
  vendor:
  laravel-cache:
  ollama-data:
