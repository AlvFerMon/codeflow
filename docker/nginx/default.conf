server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Subidas grandes de archivos y carpetas (hasta 500 MB por subida)
    client_max_body_size 520M;
    client_body_timeout 300s;
    charset utf-8;

    # Compresión de HTML, CSS, JS y JSON
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Assets de Vite: el nombre lleva un hash, se pueden cachear un año
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Manifiesto de la app web instalable (tipo MIME explícito)
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
    }

    # No servir ficheros ocultos (.env, .git...)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
