; Subidas grandes (coherente con CODEFLOW_MAX_FILE_MB=50, CODEFLOW_MAX_UPLOAD_MB=500,
; CODEFLOW_MAX_FILES=1000 y client_max_body_size de nginx)
memory_limit = 1024M
upload_max_filesize = 50M
post_max_size = 520M
max_file_uploads = 1000
max_input_vars = 5000
max_execution_time = 300
max_input_time = 300
expose_php = Off

; Rendimiento: el código se monta desde Windows (lento), así que se evita
; comprobar los archivos en cada petición. Los cambios se ven en <= 2 s.
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
realpath_cache_size = 4096K
realpath_cache_ttl = 600
