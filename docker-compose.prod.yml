# CodeFlow — producción (servidor propio con Docker Desktop). Se SUMA a docker-compose.yml:
#   en .env:  COMPOSE_FILE=docker-compose.yml;docker-compose.prod.yml   (en Linux/macOS separar con ":")
#   y después los comandos de siempre: docker compose up -d --build
# Guía completa: docs/DESPLIEGUE.md
#
#   Internet ─ router (80/443) ─ caddy (HTTPS) ─ web (nginx) ─ app (PHP) ─ mysql
#                                                                └─ queue ─ ollama (GPU)
# Solo caddy publica puertos hacia fuera. La web, Mailpit y MySQL quedan en 127.0.0.1 (solo desde el servidor).

x-prod-env: &prod-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: https://${CODEFLOW_DOMAIN:?Falta CODEFLOW_DOMAIN en .env}
  LOG_LEVEL: warning
  # Caddy y nginx están delante de Laravel
  TRUSTED_PROXIES: "*"
  SESSION_SECURE_COOKIE: "true"
  CODEFLOW_SEED_DEMO: ${CODEFLOW_SEED_DEMO:-false}
  # Correo: por defecto sigue yendo a Mailpit (http://localhost:8025 en el servidor).
  # Para enviar correos reales basta con rellenar MAIL_HOST, MAIL_PORT, MAIL_USERNAME... en .env
  MAIL_MAILER: smtp
  MAIL_SCHEME: ${MAIL_SCHEME:-}
  MAIL_HOST: ${MAIL_HOST:-mailpit}
  MAIL_PORT: ${MAIL_PORT:-1025}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@codeflow.test}

services:
  mysql:
    # Sin puerto hacia fuera (para DBeaver, solo desde el propio servidor)
    ports: !override
      - "127.0.0.1:${DB_FORWARD_PORT:-3307}:3306"

  app:
    environment: *prod-env

  queue:
    environment: *prod-env

  web:
    # La web solo se ve desde el servidor; desde fuera se entra por Caddy
    ports: !override
      - "127.0.0.1:${APP_PORT:-8080}:80"

  mailpit:
    ports: !override
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

  # HTTPS automático (Let's Encrypt) para CODEFLOW_DOMAIN
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      CODEFLOW_DOMAIN: ${CODEFLOW_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # Ollama con la gráfica NVIDIA (Docker Desktop + WSL2 + driver NVIDIA actualizado)
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Mantiene el subdominio de DuckDNS apuntando a la IP de casa (perfil "duckdns")
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    profiles: ["duckdns"]
    restart: unless-stopped
    environment:
      SUBDOMAINS: ${DUCKDNS_SUBDOMAIN:-}
      TOKEN: ${DUCKDNS_TOKEN:-}
      UPDATE_IP: ipv4
      TZ: Europe/Madrid

  # Copia de seguridad diaria de la base de datos (incluye los repositorios cifrados) y de backend/.env
  # (las claves APP_KEY y CODEFLOW_MASTER_KEY: sin ellas los repositorios no se pueden descifrar).
  # Resultado en ./backups (se conservan BACKUP_KEEP_DAYS días). Cópialos también fuera del servidor.
  backup:
    image: mysql:8.4
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${DB_ROOT_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_EVERY_HOURS: ${BACKUP_EVERY_HOURS:-24}
      TZ: Europe/Madrid
    entrypoint: ["sh", "/backup.sh"]
    volumes:
      - ./docker/backup/backup.sh:/backup.sh:ro
      - ./backend:/codeflow/backend:ro
      - ./backups:/backups

volumes:
  caddy-data:
  caddy-config:
